<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infinite 3D corridor scroll — Framewell live effect</title><style>

... [truncated]

.corridor{height:100%;perspective:900px;position:relative;overflow:hidden}.card{position:absolute;left:50%;top:50%;width:220px;height:140px;margin:-70px 0 0 -110px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(143,255,224,.14),rgba(138,168,255,.08));transform:translateZ(calc(var(--i)*-140px)) translateX(calc((var(--i) - 3)*44px)) rotateY(calc((var(--i) - 3)*-12deg));animation:drive 6s linear infinite;animation-delay:calc(var(--i)*-.75s)}.vanish{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 8%,rgba(7,8,11,.8) 78%)}.title{position:absolute;left:26px;bottom:24px;right:26px}.title h2{font-size:44px;line-height:.9;letter-spacing:-.08em}@keyframes drive{to{transform:translateZ(260px) translateX(calc((var(--i) - 3)*-24px)) rotateY(calc((var(--i) - 3)*12deg));opacity:.05}}</style></head><body><div class="frame"><main class="specimen" aria-label="Infinite 3D corridor scroll"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="label">Scroll cinema · Portfolio</span></div><section class="stage"><div class='corridor'><div class='card' style='--i:0'></div><div class='card' style='--i:1'></div><div class='card' style='--i:2'></div><div class='card' style='--i:3'></div><div class='card' style='--i:4'></div><div class='card' style='--i:5'></div><div class='card' style='--i:6'></div><div class='card' style='--i:7'></div><div class='vanish'></div><div class='title'><span class='chip'>physics scroll corridor</span><h2>Infinite 3D corridor scroll</h2></div></div></section></main></div></body></html>
