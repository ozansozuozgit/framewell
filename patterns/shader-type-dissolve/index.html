... [truncated]

.type{height:100%;display:grid;place-items:center;text-align:center}.word{font-size:clamp(50px,13vw,122px);font-weight:900;letter-spacing:-.11em;line-height:.78;position:relative;text-transform:uppercase}.word span{display:inline-block;animation:dust 2.2s ease-in-out infinite;animation-delay:calc(var(--i)*50ms)}.word:after{content:'';position:absolute;inset:-20%;background:radial-gradient(circle,var(--a),transparent 34%);filter:blur(24px);opacity:.25;z-index:-1}@keyframes dust{35%{transform:translateY(-18px) rotate(8deg);filter:blur(3px);opacity:.28}70%{transform:none;filter:none;opacity:1}}</style></head><body><div class="frame"><main class="specimen" aria-label="Shader text dissolve"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="label">Text effect · Portfolio</span></div><section class="stage"><div class='type'><div><div class='word'><span style='--i:0'>D</span><span style='--i:1'>I</span><span style='--i:2'>S</span><span style='--i:3'>S</span><span style='--i:4'>O</span><span style='--i:5'>L</span><span style='--i:6'>V</span><span style='--i:7'>E</span></div><p class='muted'>Large type breaks into particles and reforms on hover/focus.</p></div></div></section></main></div></body></html>
