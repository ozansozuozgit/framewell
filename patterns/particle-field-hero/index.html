<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle field hero — Framewell pattern</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#121722;--ink:#f7f3e8;--muted:#9ea7b7;--line:rgba(255,255,255,.12);--accent:#8be9d5;--accent2:#ffcf70;--danger:#ff796f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,rgba(139,233,213,.18),transparent 32%),linear-gradient(135deg,#08090d,#111827 56%,#161008);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.frame{min-height:100vh;padding:22px;display:grid;place-items:center}.specimen{width:min(760px,100%);min-height:390px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));box-shadow:0 24px 80px rgba(0,0,0,.38);overflow:hidden;position:relative}.bar{display:flex;gap:8px;padding:16px 18px;border-bottom:1px solid var(--line);align-items:center}.dot{width:9px;height:9px;border-radius:999px;background:#536072}.dot:nth-child(1){background:#ff796f}.dot:nth-child(2){background:#ffcf70}.dot:nth-child(3){background:#8be9d5}.label{margin-left:auto;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}.stage{padding:26px}.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);font-size:12px;color:var(--muted)}button,.button{font:inherit;color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:14px;padding:10px 13px}button:hover,.button:hover{background:rgba(255,255,255,.12)}.grid{display:grid;gap:12px}.muted{color:var(--muted)}@media(max-width:560px){.frame{padding:10px}.specimen{border-radius:20px}.stage{padding:18px}}

.field{height:270px;position:relative;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:#070910}.particle{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);left:var(--x);top:var(--y);animation:float calc(5s + var(--d)*1s) infinite alternate}.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}@keyframes float{to{transform:translate(18px,-24px);opacity:.35}}</style>
</head>
<body>
<div class="frame"><main class="specimen" aria-label="Particle field hero"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="label">Ambient · Landing page</span></div><section class="stage"><div class="field"><span class="particle" style="--x:0%;--y:0%;--d:0"></span><span class="particle" style="--x:17%;--y:29%;--d:1"></span><span class="particle" style="--x:34%;--y:58%;--d:2"></span><span class="particle" style="--x:51%;--y:87%;--d:3"></span><span class="particle" style="--x:68%;--y:26%;--d:4"></span><span class="particle" style="--x:85%;--y:55%;--d:0"></span><span class="particle" style="--x:7%;--y:84%;--d:1"></span><span class="particle" style="--x:24%;--y:23%;--d:2"></span><span class="particle" style="--x:41%;--y:52%;--d:3"></span><span class="particle" style="--x:58%;--y:81%;--d:4"></span><span class="particle" style="--x:75%;--y:20%;--d:0"></span><span class="particle" style="--x:92%;--y:49%;--d:1"></span><span class="particle" style="--x:14%;--y:78%;--d:2"></span><span class="particle" style="--x:31%;--y:17%;--d:3"></span><span class="particle" style="--x:48%;--y:46%;--d:4"></span><span class="particle" style="--x:65%;--y:75%;--d:0"></span><span class="particle" style="--x:82%;--y:14%;--d:1"></span><span class="particle" style="--x:4%;--y:43%;--d:2"></span><span class="particle" style="--x:21%;--y:72%;--d:3"></span><span class="particle" style="--x:38%;--y:11%;--d:4"></span><span class="particle" style="--x:55%;--y:40%;--d:0"></span><span class="particle" style="--x:72%;--y:69%;--d:1"></span><span class="particle" style="--x:89%;--y:8%;--d:2"></span><span class="particle" style="--x:11%;--y:37%;--d:3"></span><div class="center"><div><span class="chip">Ambient only</span><h2>Particle background</h2></div></div></div></section></main></div>
<script>document.documentElement.dataset.pattern="particle-field-hero";</script>
</body></html>
