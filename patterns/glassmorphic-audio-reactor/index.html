<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glassmorphic audio reactor — Framewell live effect</title><style>
:root{color-scheme:dark;--bg:#07080b;--ink:#fff8ea;--muted:#aab0bd;--line:rgba(255,255,255,.14);--a:#8fffe0;--b:#ffcf5a;--c:#ff6a88;--d:#8aa8ff;--panel:rgba(255,255,255,.065)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07080b;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.frame{min-height:100vh;padding:18px;display:grid;place-items:center;background:radial-gradient(circle at 20% 18%,rgba(143,255,224,.16),transparent 28%),radial-gradient(circle at 86% 74%,rgba(255,106,136,.14),transparent 28%),linear-gradient(135deg,#07080b,#111521 58%,#120d08)}.specimen{width:min(780px,100%);height:min(460px,calc(100vh - 36px));border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.028));box-shadow:0 34px 90px rgba(0,0,0,.45);overflow:hidden;position:relative}.bar{height:48px;display:flex;gap:8px;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.22);backdrop-filter:blur(20px)}.dot{width:9px;height:9px;border-radius:50%;background:#5f6878}.dot:nth-child(1){background:var(--c)}.dot:nth-child(2){background:var(--b)}.dot:nth-child(3){background:var(--a)}.label{margin-left:auto;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.stage{position:absolute;inset:48px 0 0;padding:24px}.chip{display:inline-flex;gap:6px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;color:var(--muted)}h1,h2,h3,p{margin:0}.muted{color:var(--muted)}button{font:inherit;color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:9px 13px}.grain:after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(circle at 25% 30%,#fff 0 1px,transparent 1px);background-size:4px 4px;mix-blend-mode:overlay}@media(max-width:620px){.frame{padding:10px}.specimen{border-radius:22px}.stage{padding:16px}.label{font-size:9px}}

.u{height:100%;position:relative;overflow:hidden}.u-title{position:absolute;left:24px;bottom:22px;right:24px;z-index:4}.u-title h2{font-size:42px;line-height:.88;letter-spacing:-.08em}.u-note{position:absolute;right:18px;top:18px;z-index:4;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.u button,.u input{font:inherit}.u i{display:block}.reactor{display:grid;place-items:center;height:100%}.orb{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,var(--a),transparent 62%);box-shadow:0 0 80px rgba(143,255,224,.2);animation:orbBeat 1.4s ease-in-out infinite}.bars{position:absolute;left:18%;right:18%;bottom:58px;display:flex;gap:7px;align-items:end;justify-content:center}.bars i{width:9px;height:calc(22px + (var(--i)%8)*8px);border-radius:99px;background:var(--a);animation:barBeat .8s ease-in-out infinite;animation-delay:calc(var(--i)*45ms)}@keyframes orbBeat{50%{transform:scale(1.15);filter:hue-rotate(80deg)}}@keyframes barBeat{50%{height:100px;background:var(--c)}}</style></head><body><div class="frame"><main class="specimen" aria-label="Glassmorphic audio reactor"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="label">Audio visual · Media</span></div><section class="stage"><div class='u reactor'><div class='orb'></div><div class='bars'><i class='' style='--i:0'></i><i class='' style='--i:1'></i><i class='' style='--i:2'></i><i class='' style='--i:3'></i><i class='' style='--i:4'></i><i class='' style='--i:5'></i><i class='' style='--i:6'></i><i class='' style='--i:7'></i><i class='' style='--i:8'></i><i class='' style='--i:9'></i><i class='' style='--i:10'></i><i class='' style='--i:11'></i><i class='' style='--i:12'></i><i class='' style='--i:13'></i><i class='' style='--i:14'></i><i class='' style='--i:15'></i><i class='' style='--i:16'></i><i class='' style='--i:17'></i><i class='' style='--i:18'></i><i class='' style='--i:19'></i><i class='' style='--i:20'></i><i class='' style='--i:21'></i><i class='' style='--i:22'></i><i class='' style='--i:23'></i><i class='' style='--i:24'></i><i class='' style='--i:25'></i><i class='' style='--i:26'></i><i class='' style='--i:27'></i></div></div></section></main></div></body></html>
