<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding constellation picker — Framewell live effect</title><style>
:root{color-scheme:dark;--bg:#07080b;--ink:#fff8ea;--muted:#aab0bd;--line:rgba(255,255,255,.14);--a:#8fffe0;--b:#ffcf5a;--c:#ff6a88;--d:#8aa8ff;--panel:rgba(255,255,255,.065)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07080b;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.frame{min-height:100vh;padding:18px;display:grid;place-items:center;background:radial-gradient(circle at 20% 18%,rgba(143,255,224,.16),transparent 28%),radial-gradient(circle at 86% 74%,rgba(255,106,136,.14),transparent 28%),linear-gradient(135deg,#07080b,#111521 58%,#120d08)}.specimen{width:min(780px,100%);height:min(460px,calc(100vh - 36px));border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.028));box-shadow:0 34px 90px rgba(0,0,0,.45);overflow:hidden;position:relative}.bar{height:48px;display:flex;gap:8px;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.22);backdrop-filter:blur(20px)}.dot{width:9px;height:9px;border-radius:50%;background:#5f6878}.dot:nth-child(1){background:var(--c)}.dot:nth-child(2){background:var(--b)}.dot:nth-child(3){background:var(--a)}.label{margin-left:auto;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.stage{position:absolute;inset:48px 0 0;padding:24px}.chip{display:inline-flex;gap:6px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;color:var(--muted)}h1,h2,h3,p{margin:0}.muted{color:var(--muted)}button{font:inherit;color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:9px 13px}.grain:after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(circle at 25% 30%,#fff 0 1px,transparent 1px);background-size:4px 4px;mix-blend-mode:overlay}@media(max-width:560px){.frame{padding:8px}.specimen{border-radius:20px}.stage{padding:16px}}

.stars{height:100%;position:relative;overflow:hidden}.star{position:absolute;left:var(--x);top:var(--y);width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 18px var(--a);animation:twinkle 2s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.13s)}.cursor{position:absolute;left:50%;top:50%;width:120px;height:120px;border:1px solid rgba(143,255,224,.35);border-radius:50%;transform:translate(-50%,-50%);animation:drift 6s ease-in-out infinite}.title{position:absolute;left:26px;bottom:24px;right:26px}.title h2{font-size:42px;letter-spacing:-.06em}@keyframes twinkle{to{opacity:.35;transform:scale(.55)}}@keyframes drift{50%{transform:translate(-20%,-70%) scale(1.25)}}</style></head><body><div class="frame"><main class="specimen" aria-label="Onboarding constellation picker"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="label">Onboarding · AI app</span></div><section class="stage"><div class='stars'><span class='star' style='--i:0;--x:0%;--y:0%'></span><span class='star' style='--i:1;--x:23%;--y:41%'></span><span class='star' style='--i:2;--x:46%;--y:82%'></span><span class='star' style='--i:3;--x:69%;--y:35%'></span><span class='star' style='--i:4;--x:92%;--y:76%'></span><span class='star' style='--i:5;--x:19%;--y:29%'></span><span class='star' style='--i:6;--x:42%;--y:70%'></span><span class='star' style='--i:7;--x:65%;--y:23%'></span><span class='star' style='--i:8;--x:88%;--y:64%'></span><span class='star' style='--i:9;--x:15%;--y:17%'></span><span class='star' style='--i:10;--x:38%;--y:58%'></span><span class='star' style='--i:11;--x:61%;--y:11%'></span><span class='star' style='--i:12;--x:84%;--y:52%'></span><span class='star' style='--i:13;--x:11%;--y:5%'></span><span class='star' style='--i:14;--x:34%;--y:46%'></span><span class='star' style='--i:15;--x:57%;--y:87%'></span><span class='star' style='--i:16;--x:80%;--y:40%'></span><span class='star' style='--i:17;--x:7%;--y:81%'></span><span class='star' style='--i:18;--x:30%;--y:34%'></span><span class='star' style='--i:19;--x:53%;--y:75%'></span><span class='star' style='--i:20;--x:76%;--y:28%'></span><span class='star' style='--i:21;--x:3%;--y:69%'></span><span class='star' style='--i:22;--x:26%;--y:22%'></span><span class='star' style='--i:23;--x:49%;--y:63%'></span><span class='star' style='--i:24;--x:72%;--y:16%'></span><span class='star' style='--i:25;--x:95%;--y:57%'></span><span class='star' style='--i:26;--x:22%;--y:10%'></span><span class='star' style='--i:27;--x:45%;--y:51%'></span><span class='star' style='--i:28;--x:68%;--y:4%'></span><span class='star' style='--i:29;--x:91%;--y:45%'></span><span class='star' style='--i:30;--x:18%;--y:86%'></span><span class='star' style='--i:31;--x:41%;--y:39%'></span><span class='star' style='--i:32;--x:64%;--y:80%'></span><span class='star' style='--i:33;--x:87%;--y:33%'></span><span class='star' style='--i:34;--x:14%;--y:74%'></span><span class='star' style='--i:35;--x:37%;--y:27%'></span><span class='star' style='--i:36;--x:60%;--y:68%'></span><span class='star' style='--i:37;--x:83%;--y:21%'></span><span class='star' style='--i:38;--x:10%;--y:62%'></span><span class='star' style='--i:39;--x:33%;--y:15%'></span><span class='star' style='--i:40;--x:56%;--y:56%'></span><span class='star' style='--i:41;--x:79%;--y:9%'></span><div class='cursor'></div><div class='title'><span class='chip'>ambient pointer field</span><h2>Onboarding constellation picker</h2></div></div></section></main></div></body></html>
