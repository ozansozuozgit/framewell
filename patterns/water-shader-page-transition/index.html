<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water shader page transition — Framewell live effect</title><style>

... [truncated]

.water{height:100%;display:grid;place-items:center;position:relative;overflow:hidden}.page{width:68%;height:62%;border-radius:30px;border:1px solid var(--line);background:linear-gradient(135deg,#f5e9ce,#8fffe0);color:#10131d;display:grid;place-items:center;font-size:42px;font-weight:950;letter-spacing:-.08em}.wave{position:absolute;inset:-30%;background:repeating-radial-gradient(circle at 50% 50%,rgba(143,255,224,.35) 0 2px,transparent 4px 24px);filter:url(#none) blur(1px);mix-blend-mode:screen;animation:wave 3.2s ease-in-out infinite}@keyframes wave{50%{transform:scale(.72) rotate(18deg);border-radius:42%;filter:blur(8px)}}</style></head><body><div class="frame"><main class="specimen" aria-label="Water shader page transition"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="label">Transition · Portfolio</span></div><section class="stage"><div class='water'><div class='page'>Next case</div><div class='wave'></div></div></section></main></div></body></html>
