... [truncated]

.cinema{height:100%;perspective:900px;position:relative}.plane{position:absolute;inset:auto;border:1px solid var(--line);border-radius:26px;background:linear-gradient(135deg,rgba(143,255,224,.12),rgba(138,168,255,.08));box-shadow:0 24px 70px rgba(0,0,0,.35);animation:cam 7s ease-in-out infinite}.p1{left:4%;top:10%;width:48%;height:58%;transform:translateZ(80px) rotateY(-18deg)}.p2{right:8%;top:24%;width:42%;height:48%;animation-delay:-2s}.p3{left:28%;bottom:8%;width:50%;height:24%;animation-delay:-4s}.caption{position:absolute;left:28px;bottom:26px;max-width:420px}.caption h1{font-size:46px;line-height:.86;letter-spacing:-.07em}@keyframes cam{50%{transform:translate3d(24px,-18px,120px) rotateY(14deg) rotateX(4deg)}}</style></head><body><div class="frame"><main class="specimen" aria-label="Cinematic scroll camera pass"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="label">Scroll cinema · Portfolio</span></div><section class="stage"><div class='cinema grain'><div class='plane p1'></div><div class='plane p2'></div><div class='plane p3'></div><div class='caption'><span class='chip'>scroll-directed scene</span><h1>Cinematic scroll camera pass</h1><p class='muted'>A product scene appears to move past camera planes as the page scrolls.</p></div></div></section></main></div></body></html>
